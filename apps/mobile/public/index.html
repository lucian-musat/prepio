<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Prepio</title>
    <meta name="description" content="Prepio te ajută să te pregătești pentru BAC-ul la istorie: lecții scurte, întrebări de verificare și exerciții după modelul subiectelor, cu feedback de la profesorul digital." />
    <meta name="theme-color" content="#0F766E" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prepio" />
    <meta property="og:locale" content="ro_RO" />
    <meta property="og:title" content="Prepio — pregătire BAC la istorie" />
    <meta property="og:description" content="Prepio te ajută să te pregătești pentru BAC-ul la istorie: lecții scurte, întrebări de verificare și exerciții după modelul subiectelor, cu feedback de la profesorul digital." />
    <meta property="og:image" content="https://prepio.ro/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://prepio.ro" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Start-up overlay (fonts, session, UI texts); app/_layout.tsx hides it via src/texts/bootLoader.web.ts. -->
    <style id="boot-loader-style">
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3faf7; /* color.bg */
        opacity: 1;
        transition: opacity 200ms ease-out;
      }
      #boot-loader.boot-loader--done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-loader img {
        width: 88px;
        height: 88px;
        border-radius: 24px;
        box-shadow: 0 8px 24px rgba(15, 118, 110, 0.18);
        animation: boot-loader-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-loader-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.92);
          opacity: 0.8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader {
          transition: none;
        }
        #boot-loader img {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Prepio are nevoie de JavaScript ca să funcționeze.</noscript>
    <div id="root"></div>
    <!-- A sibling of #root, not a child: React clears #root on its first commit. -->
    <div id="boot-loader" aria-hidden="true"><img src="/icon-192.png" alt="" width="88" height="88" /></div>
  </body>
</html>
