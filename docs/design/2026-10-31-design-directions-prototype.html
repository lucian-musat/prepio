<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Prepio – direcții de design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Showcase chrome (not part of the design proposals) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: Inter, system-ui, sans-serif;
  background: #EDEEF2; color: #1d1f27;
  min-height: 100vh;
}
.chrome { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px; }
.chrome h1 { font-size: 20px; margin: 0 0 4px; }
.chrome .lead { margin: 0 0 16px; color: #5b5f6e; font-size: 14px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; background: #fff; border-radius: 12px; padding: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.seg button {
  border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600;
  padding: 8px 14px; border-radius: 9px; cursor: pointer; color: #4b4f5e;
  transition: background .25s, color .25s;
}
.seg button.on { background: #1d1f27; color: #fff; }
.pick {
  margin-left: auto; border: 0; font: inherit; font-weight: 700; font-size: 14px;
  padding: 10px 16px; border-radius: 12px; cursor: pointer; background: #1d1f27; color: #fff;
  transition: transform .15s, background .25s;
}
.pick:active { transform: scale(.97); }
.pick.done { background: #16a34a; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .stage { grid-template-columns: 1fr; } .pick { margin-left: 0; } }
.info { background: #fff; border-radius: 16px; padding: 18px; font-size: 14px; line-height: 1.5; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.info h2 { font-size: 17px; margin: 0 0 4px; }
.info .tag { color: #5b5f6e; margin: 0 0 12px; }
.info h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #7a7e8c; margin: 16px 0 8px; }
.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.sw { border-radius: 8px; height: 40px; position: relative; }
.sw span { position: absolute; left: 0; right: 0; bottom: -16px; font-size: 10px; color: #7a7e8c; text-align: center; }
.swatches { margin-bottom: 18px; }
.info ul { margin: 0; padding-left: 18px; }
.info li { margin-bottom: 4px; }
.frame-wrap { display: flex; justify-content: center; }
.device {
  width: 360px; height: clamp(560px, calc(100vh - 175px), 760px); border-radius: 36px; background: #111; padding: 10px;
  box-shadow: 0 30px 60px -20px rgba(20,22,40,.35);
  transition: width .5s cubic-bezier(.22,1,.36,1), height .5s cubic-bezier(.22,1,.36,1), border-radius .5s, padding .5s;
}
.device.desktop { width: 100%; height: clamp(520px, calc(100vh - 175px), 760px); border-radius: 14px; padding: 0; background: #d9dbe1; }
.device.desktop .screen { border-radius: 14px; }

/* ---------- Design tokens per variant ---------- */
.app {
  --dur-fast: 160ms; --dur: 280ms; --dur-slow: 420ms;
  --ease: cubic-bezier(.22,1,.36,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
}
.app[data-v="a"] {
  --bg: #F5F6FB; --surface: #FFFFFF; --surface-2: #EEF0F8;
  --text: #191C3A; --muted: #5D6386; --border: #E3E6F1;
  --primary: #4F46E5; --primary-strong: #3730A3; --primary-subtle: #EEF0FF; --on-primary: #FFFFFF;
  --accent: #FF7A59; --accent-subtle: #FFF0EA; --on-accent: #FFFFFF;
  --success: #12A150; --success-subtle: #E7F7EE; --danger: #E5484D; --danger-subtle: #FDECEC;
  --hero: linear-gradient(135deg, #4F46E5 0%, #7C5CFA 60%, #A78BFA 100%);
  --font-head: 'Plus Jakarta Sans', sans-serif; --font-body: 'Plus Jakarta Sans', sans-serif;
  --head-w: 800; --head-track: -0.02em;
  --r-sm: 10px; --r: 16px; --r-lg: 22px;
  --shadow: 0 1px 2px rgba(25,28,58,.05), 0 8px 24px -12px rgba(25,28,58,.18);
  --btn-shadow: 0 6px 16px -6px rgba(79,70,229,.55);
  --btn-press: none;
}
.app[data-v="b"] {
  --bg: #F3FAF7; --surface: #FFFFFF; --surface-2: #E6F4EF;
  --text: #0F2E28; --muted: #4C6A63; --border: #D8EAE3;
  --primary: #0D9488; --primary-strong: #0A6E66; --primary-subtle: #E0F5F1; --on-primary: #FFFFFF;
  --accent: #FFC93C; --accent-subtle: #FFF6D9; --on-accent: #3A2C00;
  --success: #22A55B; --success-subtle: #E5F7EC; --danger: #E5484D; --danger-subtle: #FDECEC;
  --hero: linear-gradient(135deg, #0D9488 0%, #14B8A6 55%, #5EEAD4 100%);
  --font-head: 'Nunito', sans-serif; --font-body: 'Nunito Sans', sans-serif;
  --head-w: 900; --head-track: -0.01em;
  --r-sm: 14px; --r: 20px; --r-lg: 26px;
  --shadow: 0 2px 0 #D8EAE3;
  --btn-shadow: 0 4px 0 var(--primary-strong);
  --btn-press: translateY(3px);
  --ease: cubic-bezier(.34,1.4,.64,1);
  --dur: 320ms;
}
.app[data-v="c"] {
  --bg: #FBF8F6; --surface: #FFFFFF; --surface-2: #F5EEF0;
  --text: #24141C; --muted: #6D5A63; --border: #EDE3E7;
  --primary: #A3214F; --primary-strong: #7C1A3D; --primary-subtle: #FBEAF0; --on-primary: #FFFFFF;
  --accent: #E9962F; --accent-subtle: #FDF1E1; --on-accent: #3A2300;
  --success: #1E9E63; --success-subtle: #E6F6EE; --danger: #D93C3C; --danger-subtle: #FCEBEB;
  --hero: linear-gradient(160deg, #2A1520 0%, #5B1A36 55%, #A3214F 100%);
  --font-head: 'Fraunces', Georgia, serif; --font-body: 'Inter', sans-serif;
  --head-w: 600; --head-track: -0.01em;
  --r-sm: 8px; --r: 14px; --r-lg: 18px;
  --shadow: 0 1px 2px rgba(36,20,28,.05), 0 10px 30px -18px rgba(36,20,28,.25);
  --btn-shadow: none;
  --btn-press: none;
  --ease: cubic-bezier(.2,.8,.2,1);
  --dur: 360ms; --dur-slow: 520ms;
}
@media (prefers-reduced-motion: reduce) {
  .app { --dur-fast: 1ms; --dur: 1ms; --dur-slow: 1ms; }
}

/* ---------- App ---------- */
.screen {
  height: 100%; border-radius: 28px; overflow: hidden; position: relative; background: #fff;
}
.app {
  height: 100%; position: relative; overflow: hidden;
  background: var(--bg); color: var(--text); font-family: var(--font-body);
  transition: background var(--dur-slow) var(--ease);
}
/* Layout rule: header and primary action stay fixed, only the content between them scrolls. */
.view { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.scroll {
  flex: 1; min-height: 0; position: relative; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  scroll-padding-bottom: 24px; scrollbar-width: none;
}
.scroll::-webkit-scrollbar { display: none; }
.inner { max-width: 720px; margin: 0 auto; padding: 0 16px 24px; }
.device.desktop .inner { padding: 0 32px 40px; }
.actionbar {
  flex: none; position: relative; z-index: 4; background: var(--bg);
  padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
  border-top: 1px solid transparent;
  transition: box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.device.desktop .actionbar { padding: 14px 32px 18px; }
.actionbar.raised { border-top-color: var(--border); box-shadow: 0 -10px 24px -16px rgba(0,0,0,.25); }
.actionbar .row { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; }
.actionbar .fbslot { max-width: 720px; margin: 0 auto; }
.actionbar.good { background: var(--success-subtle); border-top-color: transparent; box-shadow: none; }
.actionbar.wrong { background: var(--danger-subtle); border-top-color: transparent; box-shadow: none; }
.actionbar.good .btn { background: var(--success); --primary-strong: color-mix(in srgb, var(--success) 75%, #000); }
.actionbar.wrong .btn { background: var(--danger); --primary-strong: color-mix(in srgb, var(--danger) 75%, #000); }

/* screen transitions */
.view.enter { animation: viewIn var(--dur-slow) var(--ease) both; }
.view.leave { animation: viewOut var(--dur) var(--ease) both; pointer-events: none; }
.view.enter.back { animation-name: viewInBack; }
.view.leave.back { animation-name: viewOutBack; }
@keyframes viewIn { from { opacity: 0; transform: translateX(32px); } to { opacity: 1; transform: none; } }
@keyframes viewOut { to { opacity: 0; transform: translateX(-16px) scale(.98); } }
@keyframes viewInBack { from { opacity: 0; transform: translateX(-32px); } to { opacity: 1; transform: none; } }
@keyframes viewOutBack { to { opacity: 0; transform: translateX(16px) scale(.98); } }
.app[data-v="c"] .view.enter { animation-name: fadeUp; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* staggered entrance */
.stagger > * { animation: rise var(--dur-slow) var(--ease) both; }
.stagger > *:nth-child(1) { animation-delay: 40ms; }
.stagger > *:nth-child(2) { animation-delay: 90ms; }
.stagger > *:nth-child(3) { animation-delay: 140ms; }
.stagger > *:nth-child(4) { animation-delay: 190ms; }
.stagger > *:nth-child(5) { animation-delay: 240ms; }
.stagger > *:nth-child(6) { animation-delay: 290ms; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.topbar {
  flex: none; position: relative; z-index: 3; display: flex; align-items: center; gap: 10px;
  padding: 16px 16px 12px; background: var(--bg); border-bottom: 1px solid transparent;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.topbar.raised { border-bottom-color: var(--border); box-shadow: 0 10px 24px -18px rgba(0,0,0,.25); }
/* Progress is orientation, not content: it lives in the fixed header so it never scrolls away. */
.topbar { flex-wrap: wrap; }
.topbar .progress { flex-basis: 100%; margin: 6px 0 0; }
.device.desktop .topbar .progress { max-width: 720px; margin: 6px auto 0; }
.topbar + .scroll .inner { padding-top: 12px; }
.device.desktop .topbar { padding: 18px 32px 14px; }
.logo { font-family: var(--font-head); font-weight: var(--head-w); font-size: 22px; letter-spacing: var(--head-track); display: flex; align-items: center; gap: 8px; }
.logo i { width: 28px; height: 28px; border-radius: 9px; background: var(--hero); display: inline-grid; place-items: center; color: #fff; font-style: normal; font-size: 15px; }
.app[data-v="c"] .logo i { border-radius: 50%; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface);
  display: grid; place-items: center; cursor: pointer; color: var(--text);
  transition: transform var(--dur-fast) var(--ease), background var(--dur) var(--ease);
}
.iconbtn:active { transform: scale(.92); }
.iconbtn svg { width: 20px; height: 20px; }
.topbar .title { font-family: var(--font-head); font-weight: var(--head-w); font-size: 17px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: var(--head-track); }

.hero {
  background: var(--hero); color: #fff; border-radius: var(--r-lg); padding: 20px; margin: 4px 0 22px;
  position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; width: 180px; height: 180px; border-radius: 50%;
  right: -50px; top: -60px; background: rgba(255,255,255,.14);
  animation: float 8s ease-in-out infinite;
}
@keyframes float { 50% { transform: translate(-14px, 10px) scale(1.06); } }
.hero small { opacity: .85; font-weight: 600; font-size: 13px; }
.hero h2 { font-family: var(--font-head); font-weight: var(--head-w); font-size: 24px; line-height: 1.2; margin: 6px 0 8px; letter-spacing: var(--head-track); }
.hero p { margin: 0; opacity: .92; font-size: 15px; line-height: 1.5; max-width: 420px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.hero .chip { background: rgba(255,255,255,.18); margin-top: 14px; }

.sec-title { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 10px; }
.sec-title h3 { font-family: var(--font-head); font-weight: var(--head-w); font-size: 18px; margin: 0; letter-spacing: var(--head-track); }
.sec-title span { color: var(--muted); font-size: 13px; }
.lessons { display: grid; gap: 10px; margin-bottom: 24px; }
.device.desktop .lessons { grid-template-columns: 1fr 1fr; }
.lesson {
  display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
  cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%;
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.lesson:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); }
.lesson:active { transform: scale(.98); }
.lesson .num {
  width: 44px; height: 44px; flex: none; border-radius: var(--r-sm); background: var(--primary-subtle); color: var(--primary);
  display: grid; place-items: center; font-family: var(--font-head); font-weight: var(--head-w); font-size: 18px;
}
.lesson:nth-child(2) .num { background: var(--accent-subtle); color: color-mix(in srgb, var(--accent) 70%, var(--text)); }
.lesson .t { font-weight: 700; font-size: 16px; line-height: 1.3; }
.lesson .m { color: var(--muted); font-size: 13px; margin-top: 3px; display: flex; gap: 8px; align-items: center; }
.lesson .go { margin-left: auto; color: var(--muted); transition: transform var(--dur) var(--ease); }
.lesson:hover .go { transform: translateX(3px); color: var(--primary); }
.diff { padding: 2px 8px; border-radius: 999px; font-weight: 700; font-size: 11px; }
.diff.easy { background: var(--success-subtle); color: var(--success); }
.diff.med { background: var(--accent-subtle); color: color-mix(in srgb, var(--accent) 65%, var(--text)); }
.diff.hard { background: var(--danger-subtle); color: var(--danger); }

/* lesson screen */
.progress { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 2px 0 18px; }
.progress b { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--primary); transition: width var(--dur-slow) var(--ease); }
.app[data-v="b"] .progress { height: 12px; }
.app[data-v="b"] .progress b { background: linear-gradient(90deg, var(--primary), #2DD4BF); box-shadow: inset 0 -3px 0 rgba(0,0,0,.08); }
.stepper { position: relative; min-height: 330px; transition: min-height var(--dur) var(--ease); }
.lcard {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow);
  padding: 20px; position: absolute; inset: 0 0 auto 0;
}
.lcard.in-next { animation: cardInNext var(--dur-slow) var(--ease) both; }
.lcard.in-prev { animation: cardInPrev var(--dur-slow) var(--ease) both; }
.lcard.out-next { animation: cardOutNext var(--dur) var(--ease) both; }
.lcard.out-prev { animation: cardOutPrev var(--dur) var(--ease) both; }
@keyframes cardInNext { from { opacity: 0; transform: translateX(60px) rotate(2deg); } to { opacity: 1; transform: none; } }
@keyframes cardInPrev { from { opacity: 0; transform: translateX(-60px) rotate(-2deg); } to { opacity: 1; transform: none; } }
@keyframes cardOutNext { to { opacity: 0; transform: translateX(-50px) scale(.96); } }
@keyframes cardOutPrev { to { opacity: 0; transform: translateX(50px) scale(.96); } }
.app[data-v="c"] .lcard.in-next, .app[data-v="c"] .lcard.in-prev { animation-name: fadeUp; }
.app[data-v="c"] .lcard.out-next, .app[data-v="c"] .lcard.out-prev { animation-name: fadeOut; }
@keyframes fadeOut { to { opacity: 0; transform: translateY(-8px); } }
.lcard .eyebrow { color: var(--primary); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.lcard h2 { font-family: var(--font-head); font-weight: var(--head-w); font-size: 22px; line-height: 1.25; margin: 6px 0 12px; letter-spacing: var(--head-track); }
.lcard p { font-size: 17px; line-height: 1.6; margin: 0 0 10px; }
.lcard .key { background: var(--accent-subtle); border-radius: var(--r-sm); padding: 10px 12px; font-size: 15px; line-height: 1.5; margin-top: 12px; }
.lcard .key b { color: color-mix(in srgb, var(--accent) 60%, var(--text)); }
.dots { display: flex; gap: 6px; justify-content: center; margin-top: 14px; }
.dots i { width: 7px; height: 7px; border-radius: 999px; background: var(--border); transition: width var(--dur) var(--ease), background var(--dur) var(--ease); }
.dots i.on { width: 22px; background: var(--primary); }

.btn {
  flex: 1; border: 0; font: inherit; font-weight: 700; font-size: 16px; padding: 14px 18px; border-radius: var(--r);
  cursor: pointer; background: var(--primary); color: var(--on-primary); box-shadow: var(--btn-shadow);
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur) var(--ease), opacity var(--dur);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover { background: var(--primary-strong); }
.app[data-v="b"] .btn:hover { background: var(--primary); filter: brightness(1.05); }
.btn:active { transform: var(--btn-press, none) scale(.98); }
.app[data-v="b"] .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--primary-strong); }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: none; }
.app[data-v="b"] .btn.ghost { box-shadow: 0 3px 0 var(--border); }
.btn.ghost:hover { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.app[data-v="c"] .btn { letter-spacing: .01em; }

/* question */
.qcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--shadow); }
.qcard h2 { font-family: var(--font-head); font-weight: var(--head-w); font-size: 20px; line-height: 1.3; margin: 6px 0 16px; letter-spacing: var(--head-track); }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--r);
  border: 2px solid var(--border); background: var(--surface); font: inherit; font-size: 16px; color: inherit;
  cursor: pointer; text-align: left; position: relative;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease), transform var(--dur-fast) var(--ease);
}
.app[data-v="b"] .opt { box-shadow: 0 3px 0 var(--border); }
.opt:hover { border-color: color-mix(in srgb, var(--primary) 40%, var(--border)); }
.opt:active { transform: scale(.98); }
.opt .k {
  width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center;
  font-weight: 800; font-size: 13px; background: var(--surface-2); color: var(--muted);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease-spring);
}
.opt.sel { border-color: var(--primary); background: var(--primary-subtle); }
.opt.sel .k { background: var(--primary); color: var(--on-primary); transform: scale(1.08); }
.opt.ok { border-color: var(--success); background: var(--success-subtle); }
.opt.ok .k { background: var(--success); color: #fff; animation: pop var(--dur-slow) var(--ease-spring); }
.opt.bad { border-color: var(--danger); background: var(--danger-subtle); animation: shake 420ms cubic-bezier(.36,.07,.19,.97); }
.opt.bad .k { background: var(--danger); color: #fff; }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }
.feedback {
  padding: 2px 0 12px; display: flex; gap: 12px; align-items: flex-start;
  animation: slideUp var(--dur-slow) var(--ease) both; font-size: 15px; line-height: 1.5;
}
.feedback.good { color: color-mix(in srgb, var(--success) 70%, var(--text)); }
.feedback.wrong { color: color-mix(in srgb, var(--danger) 70%, var(--text)); }
.feedback .ic { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; animation: pop var(--dur-slow) var(--ease-spring) both; }
.feedback.good .ic { background: var(--success); }
.feedback.wrong .ic { background: var(--danger); }
.feedback strong { display: block; font-size: 16px; }
@keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* confetti */
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.confetti i { position: absolute; width: 8px; height: 12px; border-radius: 2px; top: 40%; left: 50%; animation: burst 900ms cubic-bezier(.15,.7,.3,1) forwards; }
@keyframes burst { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }

/* writing */
.ta {
  width: 100%; min-height: 150px; border-radius: var(--r); border: 2px solid var(--border); background: var(--surface);
  padding: 14px; font: inherit; font-size: 16px; line-height: 1.55; color: var(--text); resize: vertical;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.ta:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent); }
.counter { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin: 8px 2px 14px; }
.skel { border-radius: var(--r); background: var(--surface); border: 1px solid var(--border); padding: 18px; margin-top: 14px; display: grid; gap: 10px; animation: slideUp var(--dur) var(--ease) both; }
.skel .l { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2) 0%, var(--border) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; font-weight: 600; }
.thinking span { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); animation: blink 1s infinite ease-in-out; }
.thinking span:nth-child(2) { animation-delay: .15s; } .thinking span:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
.result { margin-top: 14px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 18px; }
.grade { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
.ring { width: 76px; height: 76px; position: relative; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--primary); stroke-linecap: round; stroke-dasharray: 201; stroke-dashoffset: 201; transition: stroke-dashoffset 1.1s var(--ease); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-head); font-weight: var(--head-w); font-size: 24px; }
.grade h3 { font-family: var(--font-head); font-weight: var(--head-w); margin: 0 0 4px; font-size: 18px; }
.grade p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
.sugg { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.sugg li { display: flex; gap: 10px; font-size: 15px; line-height: 1.45; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); }
.sugg li::before { content: "→"; color: var(--primary); font-weight: 800; }
.label-sm { color: var(--muted); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 18px 0 8px; }
.done-wrap { text-align: center; padding: 30px 8px; }
.done-wrap .big { font-size: 56px; animation: pop 600ms var(--ease-spring) both; }
.done-wrap h2 { font-family: var(--font-head); font-weight: var(--head-w); font-size: 24px; margin: 10px 0 6px; }
.done-wrap p { color: var(--muted); margin: 0 0 20px; }
</style>
</head>
<body>
<div class="chrome">
  <h1>Prepio: trei direcții de design</h1>
  <p class="lead">Fiecare variantă e un prototip pe care poți da click. Intră într-o lecție, treci prin cartonașe, răspunde la întrebare (încearcă și un răspuns greșit) și trimite exercițiul de scriere. Datele sunt fictive.</p>
  <div class="toolbar">
    <div class="seg" id="variants">
      <button data-v="a" class="on">A · Indigo Focus</button>
      <button data-v="b">B · Mentă Prietenoasă</button>
      <button data-v="c">C · Prună Modernă</button>
    </div>
    <div class="seg" id="sizes">
      <button data-s="phone" class="on">Telefon 360px</button>
      <button data-s="desktop">Desktop</button>
    </div>
    <div class="seg" id="lengths">
      <button data-len="normal" class="on">Text normal</button>
      <button data-len="long">Text lung</button>
    </div>
    <button class="pick" id="pick" data-choice="a">Aleg varianta A</button>
  </div>

  <div class="stage">
    <div class="frame-wrap">
      <div class="device" id="device">
        <div class="screen"><div class="app" id="app" data-v="a"></div></div>
      </div>
    </div>
    <aside class="info" id="info"></aside>
  </div>
</div>

<script>
const VARIANTS = {
  a: {
    name: 'A · Indigo Focus',
    tag: 'Calm, curat, „produs serios”. Indigo pentru concentrare, coral cald ca accent ca să nu fie rece.',
    sw: [['#4F46E5','primar'],['#FF7A59','accent'],['#191C3A','text'],['#F5F6FB','fundal'],['#12A150','corect'],['#E5484D','greșit'],['#EEF0FF','subtil'],['#FFFFFF','suprafață']],
    font: 'Plus Jakarta Sans (titluri și text). Un singur font geometric și modern, cu diacritice românești complete.',
    motion: ['Tranziții line care decelerează (ease-out), 280–420 ms', 'Ecranele glisează lateral, iar lista apare în cascadă', 'Feedback: bifă cu „pop” elastic, tremur scurt la greșeală, confetti discret'],
    feel: 'Ca Linear, Notion sau Khan Academy, dar mai cald.'
  },
  b: {
    name: 'B · Mentă Prietenoasă',
    tag: 'Cea mai jucăușă variantă: butoane „tactile” cu umbră 3D, colțuri rotunde, teal proaspăt și galben însorit.',
    sw: [['#0D9488','primar'],['#FFC93C','accent'],['#0F2E28','text'],['#F3FAF7','fundal'],['#22A55B','corect'],['#E5484D','greșit'],['#E0F5F1','subtil'],['#FFFFFF','suprafață']],
    font: 'Nunito (titluri, rotunjit și prietenos) + Nunito Sans (text, foarte lizibil).',
    motion: ['Animații cu „arc” (spring), ușor elastice, 320 ms', 'Butoanele se apasă fizic în jos', 'Bară de progres groasă, recompensă vizuală mai puternică'],
    feel: 'Aproape de Duolingo sau Brilliant: energic, motivant.'
  },
  c: {
    name: 'C · Prună Modernă',
    tag: 'Evoluția brandului actual: bordo devine prună vie, aurul devine chihlimbar, iar fontul serif rămâne doar la titluri. Elegant, „academic”.',
    sw: [['#A3214F','primar'],['#E9962F','accent'],['#24141C','text'],['#FBF8F6','fundal'],['#1E9E63','corect'],['#D93C3C','greșit'],['#FBEAF0','subtil'],['#FFFFFF','suprafață']],
    font: 'Fraunces (titluri, serif modern) + Inter (text, standard de lizibilitate).',
    motion: ['Fade și ridicare verticală, mai lente și editoriale, 360–520 ms', 'Fără elasticitate, doar mișcare fluidă și sobră', 'Feedback elegant, fără confetti'],
    feel: 'Ca o publicație sau o universitate modernă: profesional, dar nu rece.'
  }
};

const LESSONS = [
  { id: 1, t: 'Unirea Principatelor (1859)', m: '6 cartonașe · 3 exerciții', d: ['easy','Ușor'] },
  { id: 2, t: 'Războiul de Independență (1877–1878)', m: '7 cartonașe · 4 exerciții', d: ['med','Mediu'] },
  { id: 3, t: 'Marea Unire (1918)', m: '8 cartonașe · 4 exerciții', d: ['hard','Dificil'] },
];
const CARDS = [
  { e: 'Context', h: 'Adunările ad-hoc din 1857', p: 'După Războiul Crimeii, marile puteri au cerut consultarea românilor. Adunările ad-hoc din Moldova și Țara Românească au cerut unirea într-un singur stat, cu un prinț străin.', k: '<b>De reținut:</b> Congresul de pace de la Paris (1856) a deschis „chestiunea română”.' },
  { e: 'Evenimentul', h: 'Dubla alegere a lui Cuza', p: 'Pe 5 ianuarie 1859 la Iași și pe 24 ianuarie 1859 la București, Alexandru Ioan Cuza a fost ales domnitor în ambele principate.', k: '<b>De reținut:</b> unirea s-a realizat printr-un fapt împlinit, ales de români.' },
  { e: 'Consecințe', h: 'Reformele lui Cuza', p: 'Secularizarea averilor mănăstirești (1863), reforma agrară (1864) și legea instrucțiunii publice au pus bazele statului român modern.', k: '<b>De reținut:</b> învățământul primar devine obligatoriu și gratuit.' },
];
const svg = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chev: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
};

const app = document.getElementById('app');
let current = null;

function mount(html, dir = 'fwd') {
  const v = document.createElement('div');
  v.className = 'view enter' + (dir === 'back' ? ' back' : '');
  v.innerHTML = html;
  if (current) {
    const old = current;
    old.classList.remove('enter');
    old.classList.add('leave');
    if (dir === 'back') old.classList.add('back');
    old.addEventListener('animationend', () => old.remove(), { once: true });
    setTimeout(() => old.remove(), 700);
  }
  app.appendChild(v);
  current = v;
  wireScroll(v);
  return v;
}

// Edge shadows only when content actually scrolls under the fixed header / action bar.
function wireScroll(v) {
  const s = v.querySelector('.scroll'), top = v.querySelector('.topbar'), bar = v.querySelector('.actionbar');
  const upd = () => {
    top.classList.toggle('raised', s.scrollTop > 4);
    if (bar) bar.classList.toggle('raised', s.scrollTop + s.clientHeight < s.scrollHeight - 4);
  };
  s.addEventListener('scroll', upd, { passive: true });
  new ResizeObserver(upd).observe(s.firstElementChild);
  new ResizeObserver(upd).observe(s);
  upd();
}

let LONG = false;

function home(dir) {
  const v = mount(`
    <div class="topbar"><div class="logo"><i>P</i>Prepio</div></div>
    <div class="scroll"><div class="inner stagger">
      <div class="hero">
        <small>Bine ai venit!</small>
        <h2>Pregătește BAC-ul la istorie, pas cu pas.</h2>
        <p>Lecții scurte, exerciții și feedback pe eseurile tale.</p>
        <span class="chip">📚 3 lecții noi</span>
      </div>
      <div class="sec-title"><h3>Istorie › Statul român modern</h3><span>3 lecții</span></div>
      <div class="lessons stagger">
        ${LESSONS.map((l, i) => `
          <button class="lesson" data-l="${l.id}">
            <div class="num">${i + 1}</div>
            <div><div class="t">${l.t}</div><div class="m"><span class="diff ${l.d[0]}">${l.d[1]}</span>${l.m}</div></div>
            <span class="go">${svg.chev}</span>
          </button>`).join('')}
      </div>
    </div></div>`, dir);
  v.querySelectorAll('.lesson').forEach(b => b.onclick = () => lesson());
}

function lesson() {
  let i = 0;
  const v = mount(`
    <div class="topbar"><button class="iconbtn" data-back aria-label="Înapoi">${svg.back}</button><div class="title">Unirea Principatelor (1859)</div><div class="progress"><b></b></div></div>
    <div class="scroll"><div class="inner">
      <div class="stepper"></div>
      <div class="dots">${CARDS.map(() => '<i></i>').join('')}</div>
    </div></div>
    <div class="actionbar"><div class="row"><button class="btn ghost" data-prev>Înapoi</button><button class="btn" data-next>Continuă</button></div></div>`);
  v.querySelector('[data-back]').onclick = () => home('back');
  const stepper = v.querySelector('.stepper');
  const bar = v.querySelector('.progress b');
  const prev = v.querySelector('[data-prev]');
  const next = v.querySelector('[data-next]');
  function render(dir) {
    const c = CARDS[i];
    const old = stepper.querySelector('.lcard:not(.out-next):not(.out-prev)');
    if (old && dir) { old.classList.add(dir === 'next' ? 'out-next' : 'out-prev'); setTimeout(() => old.remove(), 500); }
    const el = document.createElement('div');
    el.className = 'lcard ' + (dir === 'prev' ? 'in-prev' : 'in-next');
    el.innerHTML = `<div class="eyebrow">Cartonaș ${i + 1} din ${CARDS.length} · ${c.e}</div><h2>${c.h}</h2><p>${c.p}</p>${LONG ? `<p>${LONG_P}</p>` : ''}<div class="key">${c.k}</div>`;
    stepper.appendChild(el);
    v.querySelector('.scroll').scrollTo({ top: 0, behavior: 'smooth' });
    requestAnimationFrame(() => { stepper.style.minHeight = el.offsetHeight + 'px'; });
    bar.style.width = ((i + 1) / (CARDS.length + 2) * 100) + '%';
    v.querySelectorAll('.dots i').forEach((d, k) => d.classList.toggle('on', k === i));
    prev.disabled = i === 0;
    next.textContent = i === CARDS.length - 1 ? 'La exerciții' : 'Continuă';
  }
  prev.onclick = () => { if (i > 0) { i--; render('prev'); } };
  next.onclick = () => { if (i < CARDS.length - 1) { i++; render('next'); } else question(); };
  requestAnimationFrame(() => render());
}

const LONG_P = 'Convenția de la Paris din 1858 stabilise că cele două principate vor avea instituții separate, dar nu interzicea explicit alegerea aceleiași persoane. Fruntașii unioniști au folosit această lacună pentru a pune marile puteri în fața faptului împlinit.';

function question() {
  const opts = LONG
    ? ['În timpul Revoluției de la 1848, când adunările populare au cerut unirea și independența față de Imperiul Otoman', 'În ianuarie 1859, folosind faptul că Convenția de la Paris nu interzicea alegerea aceleiași persoane în ambele principate', 'În 1866, după abdicarea forțată a domnitorului și aducerea pe tron a unui prinț străin din dinastia de Hohenzollern', 'În 1877, în contextul proclamării independenței de stat și al participării la războiul ruso-româno-turc']
    : ['1848', '1859', '1866', '1877'];
  const q = LONG
    ? 'Care dintre următoarele variante descrie cel mai corect momentul și contextul în care Alexandru Ioan Cuza a fost ales domnitor al ambelor principate, ținând cont de hotărârile marilor puteri?'
    : 'În ce an a fost ales Alexandru Ioan Cuza domnitor al Principatelor Unite?';
  const correct = 1;
  let sel = null, answered = false;
  const v = mount(`
    <div class="topbar"><button class="iconbtn" data-back aria-label="Înapoi">${svg.back}</button><div class="title">Exercițiul 1 din 2</div><div class="progress"><b style="width:${(CARDS.length) / (CARDS.length + 2) * 100}%"></b></div></div>
    <div class="scroll"><div class="inner">
      <div class="qcard stagger">
        <div class="lcard-eyebrow" style="color:var(--primary);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em">Alegere unică</div>
        <h2>${q}</h2>
        <div class="opts stagger">${opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span>${o}</button>`).join('')}</div>
      </div>
    </div></div>
    <div class="actionbar"><div class="fbslot"></div><div class="row"><button class="btn" data-check disabled>Verifică</button></div></div>`);
  v.querySelector('[data-back]').onclick = () => lesson();
  const check = v.querySelector('[data-check]');
  const btns = [...v.querySelectorAll('.opt')];
  btns.forEach(b => b.onclick = () => {
    if (answered) return;
    btns.forEach(x => x.classList.remove('sel'));
    b.classList.add('sel'); sel = +b.dataset.k; check.disabled = false;
  });
  check.onclick = () => {
    if (answered) return writing();
    answered = true;
    const ok = sel === correct;
    btns[sel].classList.remove('sel');
    btns[sel].classList.add(ok ? 'ok' : 'bad');
    if (!ok) setTimeout(() => { btns[correct].classList.add('ok'); btns[correct].querySelector('.k').innerHTML = svg.check; }, 300);
    btns[sel].querySelector('.k').innerHTML = ok ? svg.check : svg.x;
    v.querySelector('.actionbar').classList.add(ok ? 'good' : 'wrong');
    v.querySelector('.fbslot').innerHTML = ok
      ? `<div class="feedback good"><span class="ic">${svg.check}</span><div><strong>Corect, bravo!</strong>Dubla alegere a avut loc în ianuarie 1859.</div></div>`
      : `<div class="feedback wrong"><span class="ic">${svg.x}</span><div><strong>Nu chiar.</strong>Răspunsul corect este 1859: dubla alegere din ianuarie.</div></div>`;
    if (ok && app.dataset.v !== 'c') confetti();
    check.textContent = 'Următorul exercițiu';
  };
}

function confetti() {
  const box = document.createElement('div');
  box.className = 'confetti';
  const cs = getComputedStyle(app);
  const colors = [cs.getPropertyValue('--primary'), cs.getPropertyValue('--accent'), cs.getPropertyValue('--success'), '#ffffff'];
  for (let k = 0; k < 28; k++) {
    const i = document.createElement('i');
    const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 120;
    i.style.setProperty('--x', Math.cos(a) * d + 'px');
    i.style.setProperty('--y', Math.sin(a) * d - 60 + 'px');
    i.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    i.style.background = colors[k % colors.length];
    i.style.animationDelay = Math.random() * 80 + 'ms';
    box.appendChild(i);
  }
  app.appendChild(box);
  setTimeout(() => box.remove(), 1200);
}

function writing() {
  const min = 80;
  const v = mount(`
    <div class="topbar"><button class="iconbtn" data-back aria-label="Înapoi">${svg.back}</button><div class="title">Exercițiul 2 din 2</div><div class="progress"><b style="width:${(CARDS.length + 1) / (CARDS.length + 2) * 100}%"></b></div></div>
    <div class="scroll"><div class="inner">
      <div class="qcard">
        <div style="color:var(--primary);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em">Exercițiu de scriere · evaluat cu AI</div>
        <h2>${LONG ? 'Prezintă două reforme adoptate în timpul domniei lui Alexandru Ioan Cuza, precizând câte un fapt istoric pentru fiecare, și argumentează, printr-un fapt istoric relevant, importanța acestor reforme pentru modernizarea statului român.' : 'Prezintă două reforme ale lui Alexandru Ioan Cuza și importanța lor.'}</h2>
        <textarea class="ta" placeholder="Scrie răspunsul tău aici…">Una dintre reformele lui Cuza a fost secularizarea averilor mănăstirești din 1863, prin care statul a preluat o mare parte din pământuri. A doua a fost reforma agrară din 1864, prin care țăranii au primit pământ. Acestea au modernizat statul.</textarea>
        <div class="counter"><span>Minim ${min} de caractere</span><span class="cnt"></span></div>
        <div class="out"></div>
      </div>
    </div></div>
    <div class="actionbar"><div class="row"><button class="btn" data-send>Trimite spre evaluare</button></div></div>`);
  v.querySelector('[data-back]').onclick = () => question();
  // Scroll only the content area (never the page) so new content lands right above the action bar.
  const reveal = el => { const s = v.querySelector('.scroll'); s.scrollTo({ top: el.offsetTop - 12, behavior: 'smooth' }); };
  const ta = v.querySelector('.ta'), cnt = v.querySelector('.cnt'), send = v.querySelector('[data-send]'), out = v.querySelector('.out');
  const upd = () => { cnt.textContent = ta.value.length + ' caractere'; send.disabled = ta.value.length < min; };
  ta.oninput = upd; upd();
  send.onclick = () => {
    if (send.dataset.done) return finish();
    send.disabled = true;
    send.textContent = 'Se evaluează…';
    out.innerHTML = `<div class="skel"><div class="thinking"><span></span><span></span><span></span>Se evaluează răspunsul…</div><div class="l" style="width:90%"></div><div class="l" style="width:75%"></div><div class="l" style="width:60%"></div></div>`;
    reveal(out.firstElementChild);
    setTimeout(() => {
      out.innerHTML = `
        <div class="result stagger">
          <div class="grade">
            <div class="ring"><svg width="76" height="76"><circle class="bg" cx="38" cy="38" r="32"/><circle class="fg" cx="38" cy="38" r="32"/></svg><b>0</b></div>
            <div><h3>Răspuns bun</h3><p>Ai identificat corect două reforme și le-ai datat.</p></div>
          </div>
          <div class="label-sm">Ce poți îmbunătăți</div>
          <ul class="sugg">
            <li><span>Explică <em>de ce</em> reformele au modernizat statul (de exemplu, creșterea veniturilor statului).</span></li>
            <li><span>Adaugă un argument despre consecințele reformei agrare pentru țărănime.</span></li>
          </ul>
        </div>`;
      reveal(out.firstElementChild);
      const fg = out.querySelector('.fg'), num = out.querySelector('.ring b');
      const grade = 8;
      requestAnimationFrame(() => requestAnimationFrame(() => { fg.style.strokeDashoffset = 201 * (1 - grade / 10); }));
      const t0 = performance.now();
      (function tick(t) { const p = Math.min(1, (t - t0) / 1000); num.textContent = Math.round(grade * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); })(t0);
      send.disabled = false; send.dataset.done = 1; send.textContent = 'Termină lecția';
    }, 1800);
  };
}

function finish() {
  const v = mount(`
    <div class="topbar"><button class="iconbtn" data-back aria-label="Înapoi">${svg.back}</button><div class="title">Lecție terminată</div><div class="progress"><b style="width:100%"></b></div></div>
    <div class="scroll"><div class="inner">
      <div class="done-wrap stagger"><div class="big">🎓</div><h2>Ai terminat lecția!</h2><p>Unirea Principatelor (1859)</p></div>
    </div></div>
    <div class="actionbar"><div class="row"><button class="btn" data-home>Înapoi la lecții</button></div></div>`);
  v.querySelector('[data-back]').onclick = () => home('back');
  v.querySelector('[data-home]').onclick = () => home('back');
  if (app.dataset.v !== 'c') setTimeout(confetti, 200);
}

function renderInfo(k) {
  const d = VARIANTS[k];
  document.getElementById('info').innerHTML = `
    <h2>${d.name}</h2><p class="tag">${d.tag}</p>
    <h3>Paletă</h3>
    <div class="swatches">${d.sw.map(([c, n]) => `<div class="sw" style="background:${c};${c === '#FFFFFF' ? 'border:1px solid #e5e5e5' : ''}"><span>${n}</span></div>`).join('')}</div>
    <h3>Tipografie</h3><p style="margin:0">${d.font}</p>
    <h3>Mișcare</h3><ul>${d.motion.map(m => `<li>${m}</li>`).join('')}</ul>
    <h3>Senzație</h3><p style="margin:0">${d.feel}</p>`;
}

document.querySelectorAll('#variants button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#variants button').forEach(x => x.classList.toggle('on', x === b));
  app.dataset.v = b.dataset.v;
  const pick = document.getElementById('pick');
  pick.dataset.choice = b.dataset.v; pick.textContent = 'Aleg varianta ' + b.dataset.v.toUpperCase(); pick.classList.remove('done');
  renderInfo(b.dataset.v);
  home();
});
document.querySelectorAll('#sizes button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#sizes button').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('device').classList.toggle('desktop', b.dataset.s === 'desktop');
});
document.querySelectorAll('#lengths button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#lengths button').forEach(x => x.classList.toggle('on', x === b));
  LONG = b.dataset.len === 'long';
  home();
});
document.getElementById('pick').addEventListener('click', e => {
  e.currentTarget.classList.add('done');
  e.currentTarget.textContent = '✓ Ai ales varianta ' + e.currentTarget.dataset.choice.toUpperCase();
});

renderInfo('a');
home();
</script>
</body>
</html>
